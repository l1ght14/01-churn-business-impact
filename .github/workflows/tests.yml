name: tests

# No `branches:` filter on purpose. These repos' default branch is `master`, and a
# workflow that listens only to `main` silently never runs -- the workflow shows as
# "active" in the Actions tab while producing zero runs, which looks like a passing
# project to anyone who does not open it.
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest tests/ -q --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml